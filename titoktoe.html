<div class="game">
    <button class="box"></button>

</div>

<div class="reset">
<button id="resetbtn">Reset</button>
</div>

<div class="winer">
    <iframe src="https://giphy.com/embed/o75ajIFH0QnQC3nCeD" width="400" height="300" style="" frameBorder="0" class="giphy-embed" allowFullScreen></iframe></p>

    <script>



let boxes = document.querySelectorAll(".box")
 let reset = document.querySelector(".resetbtn")


let turno = true;

const winPatterns = [
    [0,1,2],
    [3,4,5],
    [6,7,8],
    [0,3,6],
    [1,4,7],
    [2,5,8],
    [0,4,8],
    [2,4,6],
]


boxes.forEach((box) => {
    box.addEventListener("click", ()=>{
        console.log("click the button");
        if(turno){
            box.textContent = "X";
            turno = false;
        }else{
            box.textContent = "0";
            turno = true;
        }
        box.disabled = true;
checkwinner();
    })
})




function checkwinner () {
    for (let pattern of winPatterns){

        let pas1val = boxes[pattern[0]].innerText;
        let pas2val = boxes[pattern[1]].innerText;
        let pas3val = boxes[pattern[2]].innerText;

        
       
        if(pas1val != "" && pas2val != "" && pas3val != ""){
            if(pas1val === pas2val && pas2val === pas3val){
         console.log("winner ", pas1val);
            }
        
        }
    }
} 

 </script>
