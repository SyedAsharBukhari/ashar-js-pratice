<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            border: none;
            outline: none;
            text-decoration: none;
        }

        .navbar {
            background-color: black;
            display: flex;
            justify-content: space-around;
            font-size: 30px;
            padding: 10px;
            font-weight: bold;
        }

        .navbar a {
            color: white;
        }

        .navbar .cart {
            background-color: rgb(25, 127, 131);
            height: 40px;
            width: 40px;
            text-align: center;
            line-height: 40px;
            border-radius: 99%;
        }

        /* shop style */
        #shop {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }

        .shop_item {
            width: 20%;
            margin: 20px;
            box-shadow: 0px 0px 0px 1px;
            padding: 10px;
        }

        .shop_item img {
            width: 100%;
            height: 256px;
        }

        .product_info {
            padding: 5px;
        }

        .product_info h5 {
            font-size: 25px;
        }

        .product_info button {
            height: 40px;
            margin-top: 8px;
            width: 100%;
            background-color: black;
            color: rgb(196, 199, 29);
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>




    <div class="navbar">
        <a href="./properproduct.html">Home</a>
        <a href="./product.html">
            <div class="cart">
                <div id="cart_amount">0</div>
            </div>
        </a>
    </div>

    <div id="shop"></div>






<script src="./properproduct.js"></script>

</body>
</html>
